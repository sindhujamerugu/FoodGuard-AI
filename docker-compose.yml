services:
  foodguard_db_new:
    image: postgres:16
    container_name: foodguard_db_new
    environment:
      POSTGRES_DB: foodguard_db
      POSTGRES_USER: foodguard_user
      POSTGRES_PASSWORD: foodguard_password
    ports:
      - "5434:5432"
    volumes:
      - foodguard_postgres_data_new:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodguard_user -d foodguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - foodguard_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodguard_backend
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-foodguard-dev-only-change-in-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost,foodguard_backend}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3003,http://127.0.0.1:3004"
      DATABASE_NAME: foodguard_db
      DATABASE_USER: foodguard_user
      DATABASE_PASSWORD: foodguard_password
      DATABASE_HOST: foodguard_db_new
      DATABASE_PORT: "5432"
    ports:
      - "8001:8000"
    depends_on:
      foodguard_db_new:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - foodguard_network

volumes:
  foodguard_postgres_data_new:
    name: foodguard_postgres_data_new

networks:
  foodguard_network:
    name: foodguard_network